<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HỌC CÙNG PHÚC K9 — Hệ Sinh Thái Luyện Thi, Video Bài Giảng, Kho Đề Nguồn Thật & BXH Học Viên</title>
  <meta name="description" content="Hệ sinh thái giáo dục HỌC CÙNG PHÚC K9: 262+ Video bài giảng đa môn (Toán, Lí, Hóa, Sinh, Anh, Khối 10 & Ôn vào 10), Phòng luyện đề nguồn gốc thật Sở/Bộ chấm điểm tự động chuẩn GDPT 2018 và Bảng xếp hạng Hàng Tuần & Top Học Viên." />
  <meta name="theme-color" content="#0f172a" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/assets/exam-center.css" />

  <!-- MathJax Configuration for LaTeX Formulas -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="pk9-shell">
    <!-- LEFT SIDEBAR (PC & MOBILE DRAWER) -->
    <aside class="pk9-sidebar" id="pk9-sidebar" aria-label="Điều hướng Hệ sinh thái Học Cùng Phúc K9">
      <div class="pk9-brand" data-nav-tab="home">
        <div class="pk9-brand-logo">PK9</div>
        <div>
          <div class="pk9-brand-title">HỌC CÙNG PHÚC K9</div>
          <div class="pk9-brand-sub">Hệ Sinh Thái Luyện Thi 9+</div>
        </div>
      </div>

      <!-- Grade Quick Switcher -->
      <div class="pk9-grade-switcher" role="group" aria-label="Chọn khối lớp">
        <button type="button" class="pk9-grade-btn active" data-set-grade="2K9">2K9 (12)</button>
        <button type="button" class="pk9-grade-btn" data-set-grade="2K11">2K11 (10)</button>
        <button type="button" class="pk9-grade-btn" data-set-grade="2K12">2K12 (9→10)</button>
      </div>

      <div class="pk9-nav-group-label">Trung tâm học tập</div>
      <nav class="pk9-nav-list">
        <button type="button" class="pk9-nav-item active" data-nav-tab="home">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🏠</span>
            <span>Trang Chủ Hệ Sinh Thái</span>
          </span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="lectures">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🎬</span>
            <span>Video Bài Giảng Đa Môn</span>
          </span>
          <span class="pk9-nav-pill">262 bài</span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="exams">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🏛️</span>
            <span>Kho Luyện Đề & Chấm Thi</span>
          </span>
          <span class="pk9-nav-pill hot">HOT</span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="leaderboard">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🏆</span>
            <span>BXH Tuần & BXH Top</span>
          </span>
          <span class="pk9-nav-pill hot">Đua Top</span>
        </button>

        <div class="pk9-nav-group-label">Tài nguyên & Công cụ</div>

        <button type="button" class="pk9-nav-item" data-nav-tab="docs">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">📚</span>
            <span>Thư Viện PDF Pro</span>
          </span>
          <span class="pk9-nav-pill">84+ PDF</span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="archive">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🗂️</span>
            <span>Kho Tổng Ôn 2K8 / 2K9</span>
          </span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="flashcards">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🃏</span>
            <span>Flashcards 3D Công Thức</span>
          </span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="community">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🤝</span>
            <span>Thư Viện Cộng Đồng</span>
          </span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="planner">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">⏱️</span>
            <span>Bàn Học Pomodoro 9+</span>
          </span>
        </button>

        <button type="button" class="pk9-nav-item" data-nav-tab="ai">
          <span class="pk9-nav-item-left">
            <span class="pk9-nav-icon">🤖</span>
            <span>Trợ Lý AI Phúc K9</span>
          </span>
          <span class="pk9-nav-pill">24/7</span>
        </button>
      </nav>

      <!-- Live Student Profile & Rank Card -->
      <div class="pk9-sidebar-footer" id="pk9-sidebar-user-card"></div>
    </aside>
    <div class="pk9-sidebar-backdrop" id="pk9-sidebar-backdrop" data-close-mobile-sidebar="1"></div>

    <!-- MAIN WORKSPACE -->
    <div class="pk9-main-wrap">
      <!-- STICKY TOPBAR -->
      <header class="pk9-topbar">
        <div style="display:flex;align-items:center;gap:0.65rem;flex:1;min-width:0;">
          <button type="button" class="pk9-icon-btn" data-toggle-mobile-sidebar="1" title="Mở menu điều hướng" aria-label="Menu">
            ☰
          </button>
          <button type="button" class="pk9-cmd-trigger" data-open-cmd="1">
            <span>🔍 Tìm nhanh bài giảng video, đề thi Sở/Bộ, tài liệu...</span>
            <span class="pk9-kbd">Ctrl K</span>
          </button>
        </div>

        <div class="pk9-topbar-actions">
          <button type="button" class="pk9-xp-chip" id="pk9-top-xp-chip" data-nav-tab="leaderboard" title="Xem thứ hạng của bạn trên BXH Tuần & Top">
            🔥 Chuỗi 1 ngày • ⚡ 100 XP
          </button>
          <button type="button" class="pk9-icon-btn" data-toggle-theme="1" title="Chuyển chế độ Sáng / Tối">
            🌙
          </button>
          <button type="button" class="pk9-auth-btn" id="pk9-top-auth-btn" data-open-auth="register">
            🚀 Đăng ký / Đăng nhập (+100 XP)
          </button>
        </div>
      </header>

      <!-- TAB PANES -->
      <main class="pk9-content" id="main-content">
        <section id="tab-home" class="pk9-tab-pane active"></section>
        <section id="tab-lectures" class="pk9-tab-pane"></section>
        <section id="tab-exams" class="pk9-tab-pane">
          <div id="exam-center-root"></div>
        </section>
        <section id="tab-leaderboard" class="pk9-tab-pane"></section>
        <section id="tab-docs" class="pk9-tab-pane"></section>
        <section id="tab-archive" class="pk9-tab-pane"></section>
        <section id="tab-flashcards" class="pk9-tab-pane"></section>
        <section id="tab-community" class="pk9-tab-pane"></section>
        <section id="tab-planner" class="pk9-tab-pane"></section>
        <section id="tab-ai" class="pk9-tab-pane"></section>
      </main>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="pk9-mobile-bottom-nav" aria-label="Điều hướng di động">
    <button type="button" class="pk9-mob-nav-btn active" data-nav-tab="home">
      <span>🏠</span>
      <span>Trang chủ</span>
    </button>
    <button type="button" class="pk9-mob-nav-btn" data-nav-tab="lectures">
      <span>🎬</span>
      <span>Bài giảng</span>
    </button>
    <button type="button" class="pk9-mob-nav-btn" data-nav-tab="exams">
      <span>🏛️</span>
      <span>Luyện đề</span>
    </button>
    <button type="button" class="pk9-mob-nav-btn" data-nav-tab="leaderboard">
      <span>🏆</span>
      <span>BXH Top</span>
    </button>
    <button type="button" class="pk9-mob-nav-btn" data-open-auth="profile">
      <span>👤</span>
      <span>Tài khoản</span>
    </button>
  </nav>

  <!-- AUTH & PROFILE MODAL -->
  <div class="pk9-modal-backdrop" id="pk9-auth-modal" role="dialog" aria-modal="true">
    <div class="pk9-modal-box" id="pk9-auth-modal-box"></div>
  </div>

  <!-- COMMAND PALETTE MODAL (CTRL + K) -->
  <div class="pk9-modal-backdrop" id="pk9-cmd-modal" role="dialog" aria-modal="true">
    <div class="pk9-modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
        <strong style="font-size:0.95rem;">⚡ Tìm kiếm nhanh toàn Hệ sinh thái Phúc K9</strong>
        <button type="button" class="pk9-icon-btn" data-close-cmd="1">✕</button>
      </div>
      <input type="search" id="pk9-cmd-input" class="pk9-input" placeholder="Gõ tên chuyên đề, bài giảng, đề thi Sở Lâm Đồng, Điện Biên..." style="margin-top:0;margin-bottom:0.75rem;" />
      <div id="pk9-cmd-results" style="max-height:340px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/assets/pk9-curriculum.js"></script>
  <script src="/assets/exam-center.js"></script>
  <script src="/assets/pk9-app.js"></script>
</body>
</html>
