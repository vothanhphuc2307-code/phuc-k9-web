<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="HỌC CÙNG PHÚC K9 hiện đang tạm ngưng hoạt động để ổn định lại. Cảm ơn mọi người đã ủng hộ.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PHÚC K9 — KHÓA APP">
  <meta property="og:description" content="Xin phép ngưng hoạt động một thời gian để ổn định lại. Cảm ơn vì sự ủng hộ.">
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/phuc-k9-favicon.png">
  <link rel="apple-touch-icon" href="/assets/phuc-k9-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>KHÓA APP — PHÚC K9</title>
  <style>
    :root{color-scheme:dark;--ink:#f7f7ff;--muted:#aaaec8;--line:rgba(255,255,255,.12);--violet:#a78bfa;--cyan:#7dd3fc;--gold:#f7c978}
    *{box-sizing:border-box}
    html{min-height:100%;background:#090b18}
    body{margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:
      radial-gradient(ellipse at 14% 13%,rgba(93,75,184,.25),transparent 38%),
      radial-gradient(ellipse at 86% 78%,rgba(39,119,153,.2),transparent 36%),
      linear-gradient(135deg,#090b18 0%,#111329 48%,#090f20 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
    .page{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;width:min(1440px,100%);margin:auto;padding:28px clamp(20px,5vw,76px) 24px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:48px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
    .brand-mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:linear-gradient(145deg,rgba(167,139,250,.25),rgba(125,211,252,.08));box-shadow:inset 0 1px rgba(255,255,255,.16),0 8px 28px rgba(0,0,0,.25);font:800 15px "Space Grotesk",sans-serif;letter-spacing:-1px}
    .brand-name{font:700 13px "Space Grotesk",sans-serif;letter-spacing:.17em;text-transform:uppercase}
    .brand-sub{display:block;margin-top:2px;color:#888da9;font:600 9px Manrope,sans-serif;letter-spacing:.22em}
    .top-status{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid rgba(247,201,120,.22);border-radius:999px;background:rgba(247,201,120,.07);color:#f7dba9;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#f2bd67;box-shadow:0 0 12px rgba(242,189,103,.85);animation:pulse 2.2s ease-in-out infinite}
    main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(290px,.9fr);align-items:center;gap:clamp(24px,5vw,76px);padding:clamp(52px,8vh,106px) 0 clamp(42px,7vh,86px)}
    .copy{position:relative;z-index:2;max-width:760px}
    .eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 25px;color:#c3b8f7;font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
    .eyebrow:before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--violet),transparent)}
    h1{margin:0;font:900 clamp(58px,8.5vw,124px)/.88 "Space Grotesk",Manrope,sans-serif;letter-spacing:-.085em;text-transform:uppercase}
    h1 span{display:block}
    .headline-lock{position:relative;width:max-content;max-width:100%;margin-top:13px;color:transparent;background:linear-gradient(105deg,#fff 0%,#d9d2ff 32%,#a78bfa 63%,#7dd3fc 100%);background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 9px 35px rgba(129,103,230,.17))}
    .headline-lock:after{content:"";position:absolute;left:2px;right:0;bottom:-13px;height:2px;border-radius:10px;background:linear-gradient(90deg,#a78bfa,#7dd3fc,transparent);opacity:.85}
    .message{max-width:610px;margin:36px 0 0;color:#d4d6e7;font-size:clamp(14px,1.35vw,17px);font-weight:500;line-height:1.95;letter-spacing:.015em}
    .message strong{color:#fff;font-weight:800}
    .thanks{display:flex;align-items:center;gap:12px;margin-top:29px;color:#f4d9a5;font-size:12px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}
    .thanks:before{content:"";width:22px;height:1px;background:var(--gold)}
    .visual{position:relative;display:grid;place-items:center;min-height:430px;perspective:1100px}
    .visual:before,.visual:after{content:"";position:absolute;width:min(76%,390px);aspect-ratio:1;border-radius:50%;filter:blur(2px);pointer-events:none}
    .visual:before{background:radial-gradient(circle,rgba(122,101,226,.19),rgba(73,134,178,.07) 46%,transparent 70%);transform:translate(12px,8px)}
    .visual:after{width:65%;border:1px solid rgba(175,166,255,.1);box-shadow:0 0 70px rgba(105,89,207,.12),inset 0 0 50px rgba(125,211,252,.04)}
    .orbital{position:absolute;width:min(94%,480px);aspect-ratio:1;border:1px solid rgba(190,184,255,.18);border-radius:50%;transform:rotateX(68deg) rotateZ(-25deg);box-shadow:0 0 40px rgba(129,112,232,.08);animation:orbit 22s linear infinite}
    .orbital:before{content:"";position:absolute;top:8%;left:17%;width:10px;height:10px;border-radius:50%;background:#b9a6ff;box-shadow:0 0 25px 7px rgba(167,139,250,.55)}
    .orbital.two{width:min(78%,400px);transform:rotateX(68deg) rotateZ(48deg);border-color:rgba(125,211,252,.2);animation:orbit2 28s linear infinite}
    .orbital.two:before{top:78%;left:12%;width:7px;height:7px;background:#7dd3fc;box-shadow:0 0 24px 6px rgba(125,211,252,.45)}
    .core{position:relative;z-index:1;width:clamp(190px,24vw,290px);aspect-ratio:1;display:grid;place-items:center;border-radius:36% 64% 58% 42% / 42% 39% 61% 58%;background:linear-gradient(145deg,rgba(181,164,255,.2),rgba(54,75,128,.13) 48%,rgba(50,179,204,.12));border:1px solid rgba(224,222,255,.28);box-shadow:inset 0 2px 2px rgba(255,255,255,.23),inset -18px -25px 55px rgba(5,10,29,.42),0 25px 95px rgba(4,7,22,.55),0 0 75px rgba(130,107,236,.15);backdrop-filter:blur(12px);transform:rotateY(-16deg) rotateX(11deg);animation:float 7s ease-in-out infinite}
    .core:before{content:"";position:absolute;inset:12%;border:1px solid rgba(255,255,255,.16);border-radius:inherit;transform:translateZ(18px);box-shadow:inset 0 0 25px rgba(255,255,255,.06)}
    .core:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.17),transparent 38%,transparent 70%,rgba(125,211,252,.08));pointer-events:none}
    .lock-symbol{position:relative;z-index:2;width:86px;height:94px;filter:drop-shadow(0 8px 22px rgba(167,139,250,.35))}
    .visual-label{position:absolute;z-index:3;bottom:8%;right:4%;padding:12px 15px;border:1px solid rgba(255,255,255,.13);border-radius:15px;background:rgba(13,17,39,.68);backdrop-filter:blur(16px);box-shadow:0 15px 42px rgba(0,0,0,.22);color:#dcd9f9;font:700 10px "Space Grotesk",sans-serif;letter-spacing:.17em;text-transform:uppercase}
    .visual-label span{display:block;margin-top:5px;color:#8e93b5;font:600 9px Manrope,sans-serif;letter-spacing:.12em}
    footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;border-top:1px solid var(--line);color:#767d9e;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .footer-right{display:flex;align-items:center;gap:9px;color:#9da2bd}
    .footer-right i{display:block;width:4px;height:4px;border-radius:50%;background:#8b82d9}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.48;transform:scale(.8)}}
    @keyframes float{0%,100%{transform:translateY(0) rotateY(-16deg) rotateX(11deg)}50%{transform:translateY(-13px) rotateY(-8deg) rotateX(16deg)}}
    @keyframes orbit{to{transform:rotateX(68deg) rotateZ(335deg)}}
    @keyframes orbit2{to{transform:rotateX(68deg) rotateZ(408deg)}}
    @media(max-width:900px){main{grid-template-columns:minmax(0,1fr) minmax(250px,.75fr);gap:20px}.visual{min-height:360px}.visual-label{right:0;bottom:4%}}
    @media(max-width:680px){
      .page{padding:18px 19px max(18px,env(safe-area-inset-bottom))}
      .topbar{min-height:42px}.brand-mark{width:38px;height:38px;border-radius:12px}.brand-name{font-size:11px}.brand-sub{font-size:8px}.top-status{gap:7px;padding:8px 10px;font-size:8px;letter-spacing:.1em}
      main{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:clamp(56px,9vh,82px) 0 38px}
      .copy{order:1;text-align:center}.eyebrow{justify-content:center;margin-bottom:20px;font-size:9px;letter-spacing:.2em}.eyebrow:before{width:20px}
      h1{font-size:clamp(56px,15.5vw,88px);line-height:.9;letter-spacing:-.09em}.headline-lock{margin:9px auto 0}.headline-lock:after{bottom:-10px}
      .message{margin:29px auto 0;max-width:480px;font-size:13px;line-height:1.85;padding:0 3px}.thanks{justify-content:center;margin-top:22px;font-size:10px;letter-spacing:.16em}
      .visual{order:2;min-height:260px;margin:17px 0 0}.core{width:clamp(154px,48vw,205px);border-radius:38% 62% 57% 43% / 43% 39% 61% 57%}.lock-symbol{width:66px;height:74px}.orbital{width:min(76vw,290px)}.orbital.two{width:min(63vw,245px)}.visual:before{width:min(70vw,260px)}.visual:after{width:58%}.visual-label{right:2%;bottom:1%;padding:9px 11px;font-size:8px}.visual-label span{font-size:8px}
      footer{flex-direction:column;justify-content:center;gap:9px;text-align:center;padding-top:15px;font-size:8px;letter-spacing:.12em}.footer-right{font-size:8px}
    }
    @media(max-width:360px){.page{padding-left:15px;padding-right:15px}.brand-name{font-size:10px}.top-status{font-size:7px;padding:7px 8px}h1{font-size:54px}.message{font-size:12px}.visual{min-height:225px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar" aria-label="Phúc K9">
      <div class="brand" aria-label="Học cùng Phúc K9">
        <div class="brand-mark" aria-hidden="true">K9</div>
        <div><div class="brand-name">PHÚC K9</div><span class="brand-sub">LEARNING ECOSYSTEM</span></div>
      </div>
      <div class="top-status"><span class="status-dot" aria-hidden="true"></span> TẠM NGƯNG HOẠT ĐỘNG</div>
    </header>

    <main>
      <section class="copy" aria-labelledby="maintenance-title">
        <p class="eyebrow">Một thông báo từ đội ngũ Phúc K9</p>
        <h1 id="maintenance-title"><span>KHÓA</span><span class="headline-lock">APP</span></h1>
        <p class="message">VÌ BỊ <strong>HẠ HẠNH KIỂM</strong>, NÊN XIN PHÉP NGƯNG HOẠT ĐỘNG 1 THỜI GIAN ĐỂ ỔN ĐỊNH LẠI.</p>
        <p class="thanks">CẢM ƠN VÌ SỰ ỦNG HỘ</p>
      </section>

      <div class="visual" aria-hidden="true">
        <div class="orbital"></div>
        <div class="orbital two"></div>
        <div class="core">
          <svg class="lock-symbol" viewBox="0 0 96 108" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 43V29C25 16.85 34.85 7 47 7C59.15 7 69 16.85 69 29V43" stroke="url(#a)" stroke-width="8" stroke-linecap="round"/>
            <rect x="10" y="39" width="76" height="61" rx="17" fill="url(#b)" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
            <circle cx="48" cy="66" r="7" fill="#17152F"/>
            <path d="M48 72V82" stroke="#17152F" stroke-width="6" stroke-linecap="round"/>
            <defs><linearGradient id="a" x1="25" y1="7" x2="76" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#D9D0FF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient><linearGradient id="b" x1="10" y1="39" x2="90" y2="105" gradientUnits="userSpaceOnUse"><stop stop-color="#E3DBFF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#76CFF0"/></linearGradient></defs>
          </svg>
        </div>
        <div class="visual-label">SYSTEM STATUS<span>PAUSED · TEMPORARILY</span></div>
      </div>
    </main>

    <footer>
      <span>HỌC CÙNG PHÚC K9</span>
      <span class="footer-right"><i></i> HẸN GẶP LẠI SỚM</span>
    </footer>
  </div>
  <script>
    // Refresh the maintenance shell cache for visitors who previously installed the app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      }, { once: true });
    }
  </script>
</body>
</html>
